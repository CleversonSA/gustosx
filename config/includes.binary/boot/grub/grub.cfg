set default=0
set timeout=5
#set timeout_style=hidden


menuentry "gustoSX Live" {
  linux /live/vmlinuz-6.1.0-54-686-pae boot=live username=gustosx quiet splashi gustosx.mode=live
  initrd /live/initrd.img-6.1.0-54-686-pae
}

menuentry "gustoSX Live (Safe Graphics - If does not booting)" {
  linux /live/vmlinuz-6.1.0-54-686-pae boot=live username=gustosx quiet splash nomodeset gustosx.mode=live
  initrd /live/initrd.img-6.1.0-54-686-pae
}

menuentry "gustoSX Live (Debug)" {
  linux /live/vmlinuz-6.1.0-54-686-pae boot=live username=gustosx quiet splash systemd.unit=multi-user.target
  initrd /live/initrd.img-6.1.0-54-686-pae
}

menuentry "gustoSX (Install)" {
  linux /live/vmlinuz-6.1.0-54-686-pae boot=live username=gustosx quiet splash gustosx.mode=install
  initrd /live/initrd.img-6.1.0-54-686-pae
}

menuentry "gustoSX (Install - Safe Graphics - If does not booting)" {
  linux /live/vmlinuz-6.1.0-54-686-pae boot=live username=gustosx quiet splash gustosx.mode=install nomodeset
  initrd /live/initrd.img-6.1.0-54-686-pae
}


